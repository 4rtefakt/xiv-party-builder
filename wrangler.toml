name = "xiv-party-builder"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Cloudflare Pages refuse la section [build] dans wrangler.toml pour les
# projets Pages — la build command doit être configurée via le dashboard
# (Settings → Builds & deployments → Build configuration → Build command).
# Mettre : npm install

# Cloudflare Pages utilise ce fichier comme source de vérité des bindings
# dès qu'il est présent dans le repo (le dashboard est ignoré).
#
# Le namespace KV "party-builder-kv" a été créé via le dashboard ;
# son ID est reporté ici.
[[kv_namespaces]]
binding = "PARTY_KV"
id = "65caa924758b44a9bdf598d664e1cd6e"
preview_id = "65caa924758b44a9bdf598d664e1cd6e"

# Pour le dev local :
#   wrangler pages dev . --kv PARTY_KV
# (KV éphémère Miniflare ; les données ne touchent pas la prod)

# Durable Object : binding vers la classe RoomBroadcast hébergée dans le
# Worker séparé `xiv-party-presence` (cf do-worker/). Sert au broadcast
# temps-réel "data changed" aux clients connectés via WebSocket.
#
# Privacy : le DO ne tracke pas qui est connecté, juste un Set de sockets
# par room. Aucune donnée sur les autres clients n'est exposée.
#
# Le Worker `xiv-party-presence` doit être déployé AVANT que Pages puisse
# résoudre ce binding. En local : `wrangler pages dev` avec les deux configs.
[[durable_objects.bindings]]
name = "ROOM_BROADCAST"
class_name = "RoomBroadcast"
script_name = "xiv-party-presence"
