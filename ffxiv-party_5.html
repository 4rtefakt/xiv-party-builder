<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Builder · FFXIV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --bg-deep: #020308;
    --panel: #0a0f1a;
    --panel-2: #0f1626;
    --line: rgba(0, 229, 255, 0.12);
    --line-bright: rgba(0, 229, 255, 0.35);
    --cyan: #00e5ff;
    --cyan-dim: #00b3cc;
    --magenta: #ff2e9a;
    --amber: #ffb547;
    --ink: #d7e6f2;
    --ink-dim: #6a8094;
    --ink-faint: #3a4a5c;
    --tank: #2b9eff;
    --heal: #4ade80;
    --melee: #ff4f6e;
    --ranged: #ffb547;
    --caster: #c084fc;
    --danger: #ff4757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Chakra Petch', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
    position: relative;
    background-image:
      radial-gradient(ellipse 800px 600px at 20% 0%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse 600px 800px at 100% 100%, rgba(255, 46, 154, 0.05) 0%, transparent 50%);
    background-attachment: fixed;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 229, 255, 0.015) 0px,
      rgba(0, 229, 255, 0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 1;
  }

  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    position: relative;
    z-index: 2;
  }

  header {
    margin-bottom: 2rem;
    padding: 1.25rem 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  header::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan) 20%, var(--magenta) 50%, var(--cyan) 80%, transparent);
    opacity: 0.5;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }

  .brand-icon {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan);
    font-size: 1.2rem;
    text-shadow: 0 0 10px var(--cyan);
  }

  h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    letter-spacing: 0.25em;
    color: var(--ink);
    text-transform: uppercase;
  }

  h1 .sep {
    color: var(--magenta);
    margin: 0 0.15em;
    text-shadow: 0 0 8px var(--magenta);
  }

  .meta-info {
    display: flex;
    gap: 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .meta-info span::before {
    content: '◇';
    margin-right: 0.4rem;
    color: var(--cyan);
  }

  .section {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    position: relative;
    clip-path: polygon(
      0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%,
      18px 100%, 0 calc(100% - 18px)
    );
  }

  .section::before,
  .section::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--cyan);
    opacity: 0.6;
  }
  .section::before {
    top: 0; left: 0;
    border-right: none;
    border-bottom: none;
  }
  .section::after {
    bottom: 0; right: 0;
    border-left: none;
    border-top: none;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: 1.25rem;
  }

  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    padding: 0.2rem 0.5rem;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.25);
  }

  h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: 0.18em;
    color: var(--ink);
    text-transform: uppercase;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line-bright), transparent);
  }

  .section-roster-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-dim);
    letter-spacing: 0.15em;
  }
  .section-roster-info .count {
    color: var(--cyan);
    font-weight: 700;
  }
  .section-roster-info .count.over { color: var(--amber); }
  .section-roster-info .count.under { color: var(--ink-dim); }

  .controls-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  @media (max-width: 720px) {
    .controls-row { grid-template-columns: 1fr; }
  }

  .control-block-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .control-block-label::before {
    content: '';
    width: 4px; height: 4px;
    background: var(--cyan);
    transform: rotate(45deg);
  }

  .segment {
    display: flex;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    padding: 3px;
    gap: 0;
  }

  .segment-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    padding: 0.65rem 0.75rem;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    font-weight: 500;
    text-align: center;
  }
  .segment-btn:hover { color: var(--ink); }
  .segment-btn.active {
    background: linear-gradient(180deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.05));
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.4);
  }
  .segment-btn .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    opacity: 0.6;
    margin-left: 0.3rem;
  }

  .players-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    padding: 0.5rem 0.75rem;
    transition: border-color 0.2s;
  }
  .player-row:hover { border-color: var(--line-bright); }
  .player-row:focus-within { border-color: var(--cyan); }

  .player-idx {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--cyan);
    width: 24px;
    text-align: center;
    opacity: 0.7;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .player-name-input {
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.95rem;
    padding: 0.3rem 0.4rem;
    width: 140px;
    min-width: 110px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--line);
    font-weight: 500;
  }
  .player-name-input:focus {
    outline: none;
    border-bottom-color: var(--cyan);
  }
  .player-name-input::placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }

  .job-icons-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1;
    align-items: center;
  }

  /* JOB ICON — SVG glyph */
  .job-icon {
    position: relative;
    width: 34px;
    height: 34px;
    background: var(--bg);
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    user-select: none;
    flex-shrink: 0;
    color: var(--ink-faint);
  }

  .job-icon img {
    width: 26px;
    height: 26px;
    display: block;
    filter: grayscale(0.35) brightness(0.85);
    transition: filter 0.15s;
    pointer-events: none;
  }

  .job-icon:hover {
    border-color: currentColor;
    transform: translateY(-1px);
  }
  .job-icon:hover img {
    filter: grayscale(0) brightness(1.1);
  }

  .job-icon[data-role="tank"]:hover { color: var(--tank); }
  .job-icon[data-role="heal"]:hover { color: var(--heal); }
  .job-icon[data-role="melee"]:hover { color: var(--melee); }
  .job-icon[data-role="ranged"]:hover { color: var(--ranged); }
  .job-icon[data-role="caster"]:hover { color: var(--caster); }

  .job-icon[data-role="tank"].selected   { color: var(--tank);   border-color: var(--tank);   background: rgba(43, 158, 255, 0.12); box-shadow: 0 0 10px rgba(43, 158, 255, 0.4); }
  .job-icon[data-role="heal"].selected   { color: var(--heal);   border-color: var(--heal);   background: rgba(74, 222, 128, 0.12); box-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
  .job-icon[data-role="melee"].selected  { color: var(--melee);  border-color: var(--melee);  background: rgba(255, 79, 110, 0.12); box-shadow: 0 0 10px rgba(255, 79, 110, 0.4); }
  .job-icon[data-role="ranged"].selected { color: var(--ranged); border-color: var(--ranged); background: rgba(255, 181, 71, 0.12); box-shadow: 0 0 10px rgba(255, 181, 71, 0.4); }
  .job-icon[data-role="caster"].selected { color: var(--caster); border-color: var(--caster); background: rgba(192, 132, 252, 0.12); box-shadow: 0 0 10px rgba(192, 132, 252, 0.4); }

  .job-icon.selected img {
    filter: grayscale(0) brightness(1.15);
  }

  .job-icon .order-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--cyan);
    color: var(--bg-deep);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--bg-deep);
    box-shadow: 0 0 6px var(--cyan);
  }
  .job-icon[data-role="tank"].selected   .order-badge { background: var(--tank);   box-shadow: 0 0 6px var(--tank); }
  .job-icon[data-role="heal"].selected   .order-badge { background: var(--heal);   box-shadow: 0 0 6px var(--heal); }
  .job-icon[data-role="melee"].selected  .order-badge { background: var(--melee);  box-shadow: 0 0 6px var(--melee); }
  .job-icon[data-role="ranged"].selected .order-badge { background: var(--ranged); box-shadow: 0 0 6px var(--ranged); }
  .job-icon[data-role="caster"].selected .order-badge { background: var(--caster); box-shadow: 0 0 6px var(--caster); }

  .job-icon[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-deep);
    color: var(--ink);
    padding: 0.25rem 0.5rem;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    white-space: nowrap;
    border: 1px solid var(--cyan);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 10;
    text-transform: none;
    font-weight: 400;
  }
  .job-icon:hover::after { opacity: 1; }

  .role-sep {
    width: 1px;
    height: 22px;
    background: var(--line);
    margin: 0 2px;
    flex-shrink: 0;
  }

  .btn-remove {
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-faint);
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    line-height: 1;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-remove:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  .add-player {
    display: flex;
    justify-content: center;
    margin-top: 1rem;
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--line-bright);
    color: var(--cyan);
    padding: 0.55rem 1.4rem;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 0.18em;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    font-weight: 500;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .btn-secondary:hover {
    background: rgba(0, 229, 255, 0.08);
    border-color: var(--cyan);
    color: #fff;
    text-shadow: 0 0 8px var(--cyan);
  }

  .compose-area {
    text-align: center;
    margin: 2rem 0;
  }

  .btn-primary {
    background: linear-gradient(180deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.04));
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 0.9rem 3rem;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    letter-spacing: 0.3em;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.05);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  }
  .btn-primary:hover {
    background: linear-gradient(180deg, rgba(0, 229, 255, 0.25), rgba(0, 229, 255, 0.08));
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 25px rgba(0, 229, 255, 0.1);
    color: #fff;
  }

  .result { display: none; }
  .result.show { display: block; animation: glitchIn 0.5s; }

  @keyframes glitchIn {
    0%   { opacity: 0; transform: translateY(8px); }
    30%  { opacity: 0.5; transform: translateX(2px); }
    50%  { opacity: 0.7; transform: translateX(-2px); }
    100% { opacity: 1; transform: translate(0); }
  }

  .result-summary {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    padding: 1rem 1.25rem;
    background: var(--bg-deep);
    border: 1px solid var(--line);
  }

  .stat { text-align: center; }
  .stat-value {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    display: block;
    letter-spacing: 0.05em;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .assignment-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.5rem;
  }

  .assignment {
    background: var(--bg-deep);
    border: 1px solid var(--line);
    padding: 0.7rem 0.85rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    position: relative;
    overflow: hidden;
  }

  .assignment::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
  }
  .assignment.tank::before   { background: var(--tank);   box-shadow: 0 0 8px var(--tank);   }
  .assignment.heal::before   { background: var(--heal);   box-shadow: 0 0 8px var(--heal);   }
  .assignment.melee::before  { background: var(--melee);  box-shadow: 0 0 8px var(--melee);  }
  .assignment.ranged::before { background: var(--ranged); box-shadow: 0 0 8px var(--ranged); }
  .assignment.caster::before { background: var(--caster); box-shadow: 0 0 8px var(--caster); }
  .assignment.bench::before  { background: var(--ink-faint); }

  .assignment-left {
    min-width: 0;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .assignment-job-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid currentColor;
    background: rgba(0, 0, 0, 0.3);
  }
  .assignment-job-icon img {
    width: 26px;
    height: 26px;
    display: block;
  }
  .assignment.tank   .assignment-job-icon { color: var(--tank); }
  .assignment.heal   .assignment-job-icon { color: var(--heal); }
  .assignment.melee  .assignment-job-icon { color: var(--melee); }
  .assignment.ranged .assignment-job-icon { color: var(--ranged); }
  .assignment.caster .assignment-job-icon { color: var(--caster); }

  .assignment-text-left {
    min-width: 0;
  }

  .assigned-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pref-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--cyan);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.1rem;
  }
  .pref-rank.bad { color: var(--danger); }
  .pref-rank.unassigned { color: var(--ink-faint); }
  .pref-rank.first { color: var(--amber); text-shadow: 0 0 6px var(--amber); }

  .assignment-right {
    text-align: right;
    flex-shrink: 0;
  }

  .assigned-job {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--ink);
    letter-spacing: 0.06em;
  }

  .assigned-slot {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.1rem;
  }

  .warning {
    background: rgba(255, 71, 87, 0.08);
    border: 1px solid rgba(255, 71, 87, 0.3);
    padding: 0.7rem 1rem;
    margin-top: 1rem;
    color: #ffaab2;
    font-size: 0.88rem;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 0.03em;
  }
  .warning::before {
    content: '⚠ ';
    color: var(--danger);
    font-weight: 700;
  }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  footer span { color: var(--magenta); }

  /* ============ SUGGESTIONS PANEL ============ */
  .suggestions {
    margin-top: 1rem;
    padding: 0.85rem 1rem;
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.06), transparent);
    border-left: 2px solid var(--cyan);
    display: none;
    animation: fadeSlide 0.3s;
  }
  .suggestions.show { display: block; }
  .suggestions.ok { border-left-color: var(--heal); background: linear-gradient(90deg, rgba(74, 222, 128, 0.06), transparent); }
  .suggestions.warn { border-left-color: var(--amber); background: linear-gradient(90deg, rgba(255, 181, 71, 0.06), transparent); }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .suggestion-header {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }
  .suggestions.ok .suggestion-header { color: var(--heal); }
  .suggestions.warn .suggestion-header { color: var(--amber); }

  .suggestion-body {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.92rem;
    color: var(--ink);
    line-height: 1.55;
  }
  .suggestion-body strong {
    color: var(--cyan);
    font-weight: 600;
  }
  .suggestions.warn .suggestion-body strong { color: var(--amber); }

<script>
'use strict';

// ============================================================
// JOBS — Dawntrail (BLU & BST exclus)
// ============================================================

const JOBS = [
  { id: 'PLD', name: 'Paladin',     role: 'tank',   icon: 'paladin'     },
  { id: 'WAR', name: 'Warrior',     role: 'tank',   icon: 'warrior'     },
  { id: 'DRK', name: 'Dark Knight', role: 'tank',   icon: 'darkknight'  },
  { id: 'GNB', name: 'Gunbreaker',  role: 'tank',   icon: 'gunbreaker'  },
  { id: 'WHM', name: 'White Mage',  role: 'heal',   icon: 'whitemage'   },
  { id: 'AST', name: 'Astrologian', role: 'heal',   icon: 'astrologian' },
  { id: 'SCH', name: 'Scholar',     role: 'heal',   icon: 'scholar'     },
  { id: 'SGE', name: 'Sage',        role: 'heal',   icon: 'sage'        },
  { id: 'MNK', name: 'Monk',        role: 'melee',  icon: 'monk'        },
  { id: 'DRG', name: 'Dragoon',     role: 'melee',  icon: 'dragoon'     },
  { id: 'NIN', name: 'Ninja',       role: 'melee',  icon: 'ninja'       },
  { id: 'SAM', name: 'Samurai',     role: 'melee',  icon: 'samurai'     },
  { id: 'RPR', name: 'Reaper',      role: 'melee',  icon: 'reaper'      },
  { id: 'VPR', name: 'Viper',       role: 'melee',  icon: 'viper'       },
  { id: 'BRD', name: 'Bard',        role: 'ranged', icon: 'bard'        },
  { id: 'MCH', name: 'Machinist',   role: 'ranged', icon: 'machinist'   },
  { id: 'DNC', name: 'Dancer',      role: 'ranged', icon: 'dancer'      },
  { id: 'BLM', name: 'Black Mage',  role: 'caster', icon: 'blackmage'   },
  { id: 'SMN', name: 'Summoner',    role: 'caster', icon: 'summoner'    },
  { id: 'RDM', name: 'Red Mage',    role: 'caster', icon: 'redmage'     },
  { id: 'PCT', name: 'Pictomancer', role: 'caster', icon: 'pictomancer' }
];

// CDN externe — repo xivapi/classjob-icons (icônes officielles SE)
const ICON_BASE = 'https://cdn.jsdelivr.net/gh/xivapi/classjob-icons@master/icons/';
const ICON_URL = (job) => ICON_BASE + job.icon + '.png';

const JOB_BY_ID = Object.fromEntries(JOBS.map(j => [j.id, j]));
const JOBS_BY_ROLE = JOBS.reduce((acc, j) => {
  (acc[j.role] ||= []).push(j);
  return acc;
}, {});

const CONTENT_BASE = {
  dungeon: { label: 'Donjon', size: 4,  comp: { tank: 1, heal: 1, dps: 2  } },
  raid8:   { label: 'Raid 8', size: 8,  comp: { tank: 2, heal: 2, dps: 4  } },
  raid24:  { label: 'Raid 24', size: 24, comp: { tank: 3, heal: 6, dps: 15 } }
};

function buildSlots(contentKey, dpsMode) {
  const base = CONTENT_BASE[contentKey];
  const slots = [];

  for (let i = 0; i < base.comp.tank; i++) slots.push({ roles: ['tank'] });
  for (let i = 0; i < base.comp.heal; i++) slots.push({ roles: ['heal'] });

  const dpsCount = base.comp.dps;

  if (dpsMode === 'unified') {
    for (let i = 0; i < dpsCount; i++) {
      slots.push({ roles: ['melee', 'ranged', 'caster'] });
    }
  } else {
    const melee = Math.ceil(dpsCount / 2);
    const distance = dpsCount - melee;
    for (let i = 0; i < melee; i++)    slots.push({ roles: ['melee'] });
    for (let i = 0; i < distance; i++) slots.push({ roles: ['ranged', 'caster'] });
  }

  return slots;
}

// ============================================================
// STATE
// ============================================================

const state = {
  contentType: 'raid8',
  dpsMode: 'unified',
  players: []
};

let nextPlayerId = 1;
const makePlayer = (name = '') => ({ id: nextPlayerId++, name, preferences: [] });

// L'utilisateur peut ajouter/retirer librement après. Mais quand il change de contenu,
// on n'écrase PAS son roster — on prévient juste s'il y a sous/sur-effectif.
// Au premier load, on remplit avec la taille du contenu par défaut.
function ensureRosterSize(targetSize) {
  while (state.players.length < targetSize) state.players.push(makePlayer());
}

ensureRosterSize(CONTENT_BASE[state.contentType].size);

// ============================================================
// RENDERING
// ============================================================

function renderSegments() {
  const contentSeg = document.getElementById('contentSeg');
  contentSeg.innerHTML = '';
  Object.entries(CONTENT_BASE).forEach(([key, conf]) => {
    const btn = document.createElement('button');
    btn.className = 'segment-btn' + (state.contentType === key ? ' active' : '');
    btn.innerHTML = `${conf.label}<span class="num">${conf.size}</span>`;
    btn.addEventListener('click', () => {
      state.contentType = key;
      // Auto-extension : si on passe à un contenu plus grand et qu'on a peu de joueurs,
      // on rajoute des lignes vides pour atteindre la taille cible
      ensureRosterSize(CONTENT_BASE[key].size);
      renderAll();
    });
    contentSeg.appendChild(btn);
  });

  const dpsSeg = document.getElementById('dpsModeSeg');
  dpsSeg.innerHTML = '';
  const modes = [
    { id: 'unified', label: 'Unifié' },
    { id: 'split',   label: 'Mêlée / Distance' }
  ];
  modes.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'segment-btn' + (state.dpsMode === m.id ? ' active' : '');
    btn.textContent = m.label;
    btn.addEventListener('click', () => {
      state.dpsMode = m.id;
      renderSegments();
    });
    dpsSeg.appendChild(btn);
  });
}

function renderRosterInfo() {
  const info = document.getElementById('rosterInfo');
  const targetSize = CONTENT_BASE[state.contentType].size;
  const current = state.players.length;
  let cls = '';
  if (current > targetSize) cls = 'over';
  else if (current < targetSize) cls = 'under';
  info.innerHTML = `<span class="count ${cls}">${current}</span> / ${targetSize}`;
}

function renderPlayers() {
  const list = document.getElementById('playersList');
  list.innerHTML = '';

  state.players.forEach((player, idx) => {
    const row = document.createElement('div');
    row.className = 'player-row';

    const idxEl = document.createElement('div');
    idxEl.className = 'player-idx';
    idxEl.textContent = String(idx + 1).padStart(2, '0');
    row.appendChild(idxEl);

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'player-name-input';
    input.placeholder = `P${String(idx + 1).padStart(2, '0')}`;
    input.value = player.name;
    input.addEventListener('input', e => { player.name = e.target.value; });
    row.appendChild(input);

    const jobsRow = document.createElement('div');
    jobsRow.className = 'job-icons-row';

    const roles = ['tank', 'heal', 'melee', 'ranged', 'caster'];
    roles.forEach((role, roleIdx) => {
      if (roleIdx > 0) {
        const sep = document.createElement('div');
        sep.className = 'role-sep';
        jobsRow.appendChild(sep);
      }
      JOBS_BY_ROLE[role].forEach(job => {
        const icon = document.createElement('div');
        icon.className = 'job-icon';
        icon.dataset.role = role;
        icon.dataset.tooltip = job.name;
        icon.innerHTML = `<img src="${ICON_URL(job)}" alt="${job.name}" loading="lazy" draggable="false">`;

        const prefIdx = player.preferences.indexOf(job.id);
        if (prefIdx !== -1) {
          icon.classList.add('selected');
          const badge = document.createElement('span');
          badge.className = 'order-badge';
          badge.textContent = prefIdx + 1;
          icon.appendChild(badge);
        }

        icon.addEventListener('click', () => {
          const i = player.preferences.indexOf(job.id);
          if (i === -1) player.preferences.push(job.id);
          else          player.preferences.splice(i, 1);
          renderPlayers();
          renderSuggestions();
        });
        jobsRow.appendChild(icon);
      });
    });

    row.appendChild(jobsRow);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn-remove';
    removeBtn.textContent = '×';
    removeBtn.title = 'Retirer';
    removeBtn.addEventListener('click', () => {
      state.players = state.players.filter(p => p.id !== player.id);
      renderPlayers();
      renderRosterInfo();
      renderSuggestions();
    });
    row.appendChild(removeBtn);

    list.appendChild(row);
  });
}

function renderAll() {
  renderSegments();
  renderRosterInfo();
  renderPlayers();
  renderSuggestions();
}

// ============================================================
// OPTIMAL ASSIGNMENT
// ============================================================

const SCORING = {
  FIRST_CHOICE: 100,
  PREF_STEP: 10,
  FORCED_BASE: -50,
  BENCH: -30,
  WORST_CASE_PENALTY: 200
};

function jobScoreForPlayer(player, jobId) {
  const idx = player.preferences.indexOf(jobId);
  if (idx === -1) return { score: SCORING.FORCED_BASE, forced: true };
  return { score: SCORING.FIRST_CHOICE - idx * SCORING.PREF_STEP, forced: false };
}

function computeOptimalAssignment() {
  const slots = buildSlots(state.contentType, state.dpsMode);
  const players = state.players.filter(p => p.name.trim() !== '');

  if (players.length === 0) return { error: 'Aucun aventurier nommé.' };

  const n = players.length;
  const m = slots.length;

  const bestPerPlayer = players.map(p =>
    p.preferences.length === 0 ? SCORING.FORCED_BASE : SCORING.FIRST_CHOICE
  );

  const upperBoundFrom = i => {
    let s = 0;
    for (let k = i; k < n; k++) s += bestPerPlayer[k];
    return s;
  };

  let bestScore = -Infinity;
  let bestForcedCount = Infinity;
  let bestAssignment = null;

  const current = new Array(n).fill(null);
  const slotTaken = new Array(m).fill(false);

  function recurse(playerIdx, currentScore, forcedCount) {
    const optimisticObjective =
      currentScore + upperBoundFrom(playerIdx) - SCORING.WORST_CASE_PENALTY * forcedCount;
    if (optimisticObjective <= bestScore) return;

    if (playerIdx === n) {
      const score = currentScore - SCORING.WORST_CASE_PENALTY * forcedCount;
      if (score > bestScore || (score === bestScore && forcedCount < bestForcedCount)) {
        bestScore = score;
        bestForcedCount = forcedCount;
        bestAssignment = current.map(a => a ? { ...a } : null);
      }
      return;
    }

    const player = players[playerIdx];
    const options = [];
    const seen = new Set();

    for (let slotIdx = 0; slotIdx < m; slotIdx++) {
      if (slotTaken[slotIdx]) continue;
      const slot = slots[slotIdx];

      const candidates = new Set();
      for (const role of slot.roles) {
        for (const job of JOBS_BY_ROLE[role]) {
          if (player.preferences.includes(job.id)) candidates.add(job.id);
        }
        const hasPref = JOBS_BY_ROLE[role].some(j => player.preferences.includes(j.id));
        if (!hasPref) candidates.add(JOBS_BY_ROLE[role][0].id);
      }

      for (const jobId of candidates) {
        const key = slotIdx + ':' + jobId;
        if (seen.has(key)) continue;
        seen.add(key);
        const { score, forced } = jobScoreForPlayer(player, jobId);
        options.push({ slotIdx, jobId, score, forced });
      }
    }

    options.push({ slotIdx: null, jobId: null, score: SCORING.BENCH, forced: false });
    options.sort((a, b) => b.score - a.score);

    for (const opt of options) {
      if (opt.slotIdx !== null) {
        slotTaken[opt.slotIdx] = true;
        current[playerIdx] = { slotIdx: opt.slotIdx, jobId: opt.jobId };
        recurse(playerIdx + 1, currentScore + opt.score, forcedCount + (opt.forced ? 1 : 0));
        slotTaken[opt.slotIdx] = false;
        current[playerIdx] = null;
      } else {
        current[playerIdx] = null;
        recurse(playerIdx + 1, currentScore + opt.score, forcedCount);
      }
    }
  }

  recurse(0, 0, 0);

  if (!bestAssignment) return { error: 'Aucune composition valide trouvée.' };

  const results = players.map((p, i) => {
    const a = bestAssignment[i];
    if (a === null) return { name: p.name, assigned: false, preferences: p.preferences };
    const job = JOB_BY_ID[a.jobId];
    const prefRank = p.preferences.indexOf(a.jobId);
    return {
      name: p.name,
      assigned: true,
      jobName: job.name,
      jobId: job.id,
      iconUrl: ICON_URL(job),
      role: job.role,
      slotRoles: slots[a.slotIdx].roles,
      prefRank,
      forced: prefRank === -1,
      preferences: p.preferences
    };
  });

  const assigned = results.filter(r => r.assigned);
  const firstChoices = assigned.filter(r => r.prefRank === 0).length;
  const forced = assigned.filter(r => r.forced).length;
  const benched = results.filter(r => !r.assigned).length;
  const satisfaction = assigned.length === 0 ? 0 :
    Math.round(assigned.reduce((sum, r) => {
      if (r.forced) return sum;
      return sum + (1 - r.prefRank / Math.max(r.preferences.length, 1)) * 100;
    }, 0) / assigned.length);

  return {
    results,
    stats: {
      total: results.length, assigned: assigned.length, benched,
      firstChoices, forced, satisfaction, slotsTotal: m
    }
  };
}

function slotShortLabel(slotRoles) {
  if (slotRoles.length === 1) {
    return { tank: 'Tank', heal: 'Healer', melee: 'Mêlée', ranged: 'Distance', caster: 'Caster' }[slotRoles[0]];
  }
  if (slotRoles.includes('melee') && slotRoles.includes('ranged') && slotRoles.includes('caster')) return 'DPS';
  if (slotRoles.includes('ranged') && slotRoles.includes('caster')) return 'Distance';
  return slotRoles.join('/');
}

function renderResult() {
  const result = computeOptimalAssignment();
  const section = document.getElementById('resultSection');
  const summary = document.getElementById('resultSummary');
  const grid = document.getElementById('assignmentGrid');
  const warningArea = document.getElementById('warningArea');

  if (result.error) {
    summary.innerHTML = `<div style="color:var(--danger)">${result.error}</div>`;
    grid.innerHTML = '';
    warningArea.innerHTML = '';
    section.classList.add('show');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  const { results, stats } = result;

  summary.innerHTML = `
    <div class="stat">
      <span class="stat-value">${stats.firstChoices}/${stats.assigned}</span>
      <span class="stat-label">1er choix</span>
    </div>
    <div class="stat">
      <span class="stat-value">${stats.satisfaction}<span style="font-size:0.7em">%</span></span>
      <span class="stat-label">Satisfaction</span>
    </div>
    <div class="stat">
      <span class="stat-value">${stats.assigned}/${stats.slotsTotal}</span>
      <span class="stat-label">Slots</span>
    </div>
    ${stats.benched > 0 ? `
    <div class="stat">
      <span class="stat-value">${stats.benched}</span>
      <span class="stat-label">Banc</span>
    </div>` : ''}
  `;

  grid.innerHTML = '';
  results.forEach(r => {
    const card = document.createElement('div');
    if (!r.assigned) {
      card.className = 'assignment bench';
      card.innerHTML = `
        <div class="assignment-left">
          <div class="assignment-text-left">
            <div class="assigned-name">${escapeHtml(r.name)}</div>
            <div class="pref-rank unassigned">// Sur le banc</div>
          </div>
        </div>
        <div class="assignment-right">
          <div class="assigned-job" style="color:var(--ink-faint)">—</div>
        </div>
      `;
    } else {
      card.className = `assignment ${r.role}`;
      let rankText, rankClass;
      if (r.forced) {
        rankText = 'Hors prefs'; rankClass = 'bad';
      } else if (r.prefRank === 0) {
        rankText = '★ 1er choix'; rankClass = 'first';
      } else {
        rankText = `Choix ${r.prefRank + 1}`; rankClass = '';
      }
      card.innerHTML = `
        <div class="assignment-left">
          <div class="assignment-job-icon">
            <img src="${r.iconUrl}" alt="${r.jobName}" loading="lazy" draggable="false">
          </div>
          <div class="assignment-text-left">
            <div class="assigned-name">${escapeHtml(r.name)}</div>
            <div class="pref-rank ${rankClass}">${rankText}</div>
          </div>
        </div>
        <div class="assignment-right">
          <div class="assigned-job">${r.jobName}</div>
          <div class="assigned-slot">${slotShortLabel(r.slotRoles)}</div>
        </div>
      `;
    }
    grid.appendChild(card);
  });

  warningArea.innerHTML = '';
  if (stats.forced > 0) {
    const w = document.createElement('div');
    w.className = 'warning';
    w.textContent = `${stats.forced} joueur${stats.forced > 1 ? 's' : ''} hors préférences — le groupe ne pouvait pas être formé autrement.`;
    warningArea.appendChild(w);
  }
  if (stats.assigned < stats.slotsTotal) {
    const w = document.createElement('div');
    w.className = 'warning';
    w.textContent = `Il manque ${stats.slotsTotal - stats.assigned} joueur${stats.slotsTotal - stats.assigned > 1 ? 's' : ''} pour compléter.`;
    warningArea.appendChild(w);
  }

  section.classList.add('show');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ============================================================
// SUGGESTIONS — analyse en temps réel des préférences
// ============================================================
//
// Stratégie : déterminer, parmi les rôles requis pour le contenu,
// lesquels sont sous-couverts en préférences premier-choix.
// Un joueur "couvre" un rôle s'il a au moins un job de ce rôle dans
// ses 2 premières préférences (cf. seuil PRIMARY_DEPTH).
// On compare la couverture (joueurs prêts à jouer le rôle) au besoin.
// ============================================================

const PRIMARY_DEPTH = 2;  // un job dans top-2 = "prêt à jouer ce rôle"

function getRoleRequirements() {
  const slots = buildSlots(state.contentType, state.dpsMode);
  const reqs = { tank: 0, heal: 0, melee: 0, ranged: 0, caster: 0, flex_dps: 0, distance: 0 };
  slots.forEach(slot => {
    if (slot.roles.length === 1) {
      reqs[slot.roles[0]]++;
    } else if (slot.roles.includes('melee') && slot.roles.includes('ranged') && slot.roles.includes('caster')) {
      reqs.flex_dps++;
    } else if (slot.roles.includes('ranged') && slot.roles.includes('caster')) {
      reqs.distance++;
    }
  });
  return reqs;
}

function analyzeCoverage() {
  const playersWithName = state.players.filter(p => p.name.trim() !== '');
  const playersWithPrefs = playersWithName.filter(p => p.preferences.length > 0);
  const reqs = getRoleRequirements();

  // Compteur de joueurs couvrant chaque rôle (avec un job dans top-N)
  const coverage = { tank: 0, heal: 0, melee: 0, ranged: 0, caster: 0 };
  playersWithPrefs.forEach(p => {
    const seenRoles = new Set();
    const top = p.preferences.slice(0, PRIMARY_DEPTH);
    top.forEach(jobId => {
      const job = JOB_BY_ID[jobId];
      if (job && !seenRoles.has(job.role)) {
        seenRoles.add(job.role);
        coverage[job.role]++;
      }
    });
  });

  // Calcul des "manques" : besoin - couverture
  // Pour les slots flex (distance/flex_dps), on additionne la couverture des rôles compatibles
  const gaps = [];
  if (coverage.tank < reqs.tank) gaps.push({ role: 'tank', missing: reqs.tank - coverage.tank });
  if (coverage.heal < reqs.heal) gaps.push({ role: 'heal', missing: reqs.heal - coverage.heal });
  if (coverage.melee < reqs.melee) gaps.push({ role: 'melee', missing: reqs.melee - coverage.melee });

  // Pour les slots distance (ranged ou caster), on combine
  const distanceCoverage = coverage.ranged + coverage.caster;
  if (distanceCoverage < reqs.distance) {
    gaps.push({ role: 'distance', missing: reqs.distance - distanceCoverage });
  }

  // Pour flex_dps (donjon), on combine les 3 catégories DPS
  const flexCoverage = coverage.melee + coverage.ranged + coverage.caster;
  // Pour ce mode, on ignore aussi les melee déjà comptés dans reqs.melee (mode split)
  // simplification : si on est en mode unifié, seuls flex_dps comptent
  if (reqs.flex_dps > 0 && flexCoverage < reqs.flex_dps) {
    gaps.push({ role: 'flex_dps', missing: reqs.flex_dps - flexCoverage });
  }

  return { coverage, reqs, gaps, playersWithName, playersWithPrefs };
}

const ROLE_LABELS_FR = {
  tank: { sing: 'tank', plur: 'tanks' },
  heal: { sing: 'healer', plur: 'healers' },
  melee: { sing: 'DPS mêlée', plur: 'DPS mêlée' },
  ranged: { sing: 'DPS distance physique', plur: 'DPS distance physique' },
  caster: { sing: 'caster', plur: 'casters' },
  distance: { sing: 'DPS distance', plur: 'DPS distance' },
  flex_dps: { sing: 'DPS', plur: 'DPS' }
};

function formatGap(gap) {
  const label = gap.missing > 1 ? ROLE_LABELS_FR[gap.role].plur : ROLE_LABELS_FR[gap.role].sing;
  return `<strong>${gap.missing} ${label}</strong>`;
}

function renderSuggestions() {
  const el = document.getElementById('suggestions');
  const header = document.getElementById('suggestionHeader');
  const body = document.getElementById('suggestionBody');

  const { gaps, playersWithName, playersWithPrefs, reqs } = analyzeCoverage();
  const targetSize = CONTENT_BASE[state.contentType].size;

  // Pas encore assez de données pour analyser
  if (playersWithName.length === 0) {
    el.classList.remove('show');
    return;
  }

  el.className = 'suggestions show';

  // Joueurs sans préférence
  const noPref = playersWithName.length - playersWithPrefs.length;

  // Cas 1 : tout est couvert et roster complet
  if (gaps.length === 0 && playersWithName.length >= targetSize && noPref === 0) {
    el.classList.add('ok');
    header.textContent = '◆ Composition viable';
    body.innerHTML = `Toutes les positions requises peuvent être pourvues avec les préférences actuelles.`;
    return;
  }

  // Cas 2 : il manque des joueurs
  const messages = [];

  if (playersWithName.length < targetSize) {
    const missing = targetSize - playersWithName.length;
    messages.push(`Il manque <strong>${missing} joueur${missing > 1 ? 's' : ''}</strong> pour compléter le groupe.`);
  }

  if (noPref > 0) {
    messages.push(`<strong>${noPref} joueur${noPref > 1 ? 's' : ''}</strong> ${noPref > 1 ? 'n\'ont' : 'n\'a'} pas encore renseigné de préférence.`);
  }

  if (gaps.length > 0) {
    el.classList.add('warn');
    header.textContent = '⚠ Besoins identifiés';
    const gapText = gaps.map(formatGap).join(gaps.length > 2 ? ', ' : ' ou ');
    messages.push(`Il nous manque principalement ${gapText} dans les préférences.`);
  } else if (messages.length > 0) {
    el.classList.add('ok');
    header.textContent = '◆ État du roster';
  } else {
    el.classList.remove('show');
    return;
  }

  body.innerHTML = messages.join('<br>');
}

// ============================================================
// IMPORT / EXPORT — encodage base64 du roster
// ============================================================
//
// Format du payload (JSON minifié → base64url) :
//   {
//     c: "raid8",          // contentType
//     d: "unified",        // dpsMode
//     p: [                 // players
//       { n: "Alice", j: ["WHM","SCH","AST"] },
//       ...
//     ]
//   }
// ============================================================

function encodeState() {
  const payload = {
    c: state.contentType,
    d: state.dpsMode,
    p: state.players
      .filter(p => p.name.trim() !== '' || p.preferences.length > 0)
      .map(p => ({
        n: p.name.trim(),
        j: p.preferences.slice()
      }))
  };
  const json = JSON.stringify(payload);
  // base64url encoding (sans padding ni / + qui posent problème dans URL)
  return btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/, '');
}

function decodeState(code) {
  // Restaurer les caractères base64 standard
  let b64 = code.replace(/-/g, '+').replace(/_/g, '/');
  // Re-padding
  while (b64.length % 4) b64 += '=';

  let payload;
  try {
    const json = decodeURIComponent(escape(atob(b64)));
    payload = JSON.parse(json);
  } catch (e) {
    throw new Error('Code invalide ou corrompu');
  }

  if (!payload || typeof payload !== 'object') throw new Error('Format invalide');
  if (!CONTENT_BASE[payload.c]) throw new Error('Type de contenu inconnu');
  if (!['unified', 'split'].includes(payload.d)) throw new Error('Mode DPS invalide');
  if (!Array.isArray(payload.p)) throw new Error('Liste de joueurs invalide');

  // Valider les jobs : filtrer les IDs inconnus silencieusement
  const validJobIds = new Set(JOBS.map(j => j.id));
  const players = payload.p.map(raw => {
    const player = makePlayer(typeof raw.n === 'string' ? raw.n : '');
    if (Array.isArray(raw.j)) {
      player.preferences = raw.j.filter(id => validJobIds.has(id));
    }
    return player;
  });

  return {
    contentType: payload.c,
    dpsMode: payload.d,
    players
  };
}

function applyImportedState(imported) {
  state.contentType = imported.contentType;
  state.dpsMode = imported.dpsMode;
  state.players = imported.players;
  // Si le roster est plus petit que la taille de contenu, on complète
  ensureRosterSize(CONTENT_BASE[state.contentType].size);
  renderAll();
}

function buildShareUrl(code) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?p=${code}`;
}

// ============================================================
// MODALS & TOAST
// ============================================================

function openModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Fallback pour anciens navigateurs / contexte non-HTTPS
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch {
      return false;
    }
  }
}

// ============================================================
// EVENT BINDINGS
// ============================================================

document.getElementById('addPlayerBtn').addEventListener('click', () => {
  state.players.push(makePlayer());
  renderPlayers();
  renderRosterInfo();
  renderSuggestions();
});

document.getElementById('composeBtn').addEventListener('click', renderResult);

// Share
document.getElementById('shareBtn').addEventListener('click', () => {
  const code = encodeState();
  const url = buildShareUrl(code);
  document.getElementById('shareUrl').value = url;
  document.getElementById('shareUrl').dataset.code = code;
  openModal('shareModal');
});

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  const url = document.getElementById('shareUrl').value;
  if (await copyToClipboard(url)) showToast('Lien copié');
  else showToast('Échec de la copie');
});

document.getElementById('copyCodeBtn').addEventListener('click', async () => {
  const code = document.getElementById('shareUrl').dataset.code;
  if (await copyToClipboard(code)) showToast('Code copié');
  else showToast('Échec de la copie');
});

// Import
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importInput').value = '';
  document.getElementById('importError').classList.remove('show');
  openModal('importModal');
});

document.getElementById('doImportBtn').addEventListener('click', () => {
  const raw = document.getElementById('importInput').value.trim();
  const errorEl = document.getElementById('importError');
  errorEl.classList.remove('show');

  if (!raw) {
    errorEl.textContent = 'Saisis un lien ou un code.';
    errorEl.classList.add('show');
    return;
  }

  // Si c'est une URL, extraire le param ?p=
  let code = raw;
  try {
    if (raw.startsWith('http://') || raw.startsWith('https://') || raw.includes('?p=')) {
      const u = new URL(raw, window.location.href);
      const param = u.searchParams.get('p');
      if (param) code = param;
    }
  } catch { /* on essaie quand même de décoder raw comme code */ }

  try {
    const imported = decodeState(code);
    applyImportedState(imported);
    closeModal('importModal');
    showToast('Groupe importé');
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.classList.add('show');
  }
});

// Reset
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Réinitialiser le roster ?')) return;
  state.players = [];
  ensureRosterSize(CONTENT_BASE[state.contentType].size);
  renderAll();
  // Hide result section
  document.getElementById('resultSection').classList.remove('show');
});

// Modal close buttons (générique)
document.querySelectorAll('[data-modal-close]').forEach(btn => {
  btn.addEventListener('click', () => {
    const overlay = btn.closest('.modal-overlay');
    if (overlay) overlay.classList.remove('show');
  });
});

// Click outside modal to close
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});

// Escape to close modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(o => o.classList.remove('show'));
  }
});

// ============================================================
// INIT — charger depuis l'URL si paramètre ?p= présent
// ============================================================

(function initFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('p');
  if (code) {
    try {
      const imported = decodeState(code);
      applyImportedState(imported);
      showToast('Groupe chargé depuis le lien');
      return;
    } catch (e) {
      console.warn('Échec de l\'import depuis URL :', e.message);
    }
  }
  renderAll();
})();
</script>
